plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   // TEMP-UNBLOCK (2026-07-25): google-services disabled so the Android build
   // does not fail at :app:processDebugGoogleServices on the stale package name
   // (com.mycompany.uniaccess) in google-services.json. Firebase is unused by
   // app code (see docs/AUDIT.md). TO RESTORE: uncomment the line below AND
   // regenerate google-services.json for package sa.isleaders.shadow.
   // id "com.google.gms.google-services"  // Google Services plugin

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing: see android/key.properties.example and
// docs/RELEASE_SIGNING.md. key.properties is git-ignored and must be
// created locally (or injected in CI) before a release build can run —
// this is intentional so a real production keystore is never committed.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def keystorePropertiesExist = keystorePropertiesFile.exists()
if (keystorePropertiesExist) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "sa.isleaders.shadow"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "sa.isleaders.shadow"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           if (keystorePropertiesExist) {
               keyAlias keystoreProperties['keyAlias']
               keyPassword keystoreProperties['keyPassword']
               storeFile file(keystoreProperties['storeFile'])
               storePassword keystoreProperties['storePassword']
           }
       }
   }

    buildTypes {
        release {
            // Release builds MUST be signed with a real release keystore
            // (android/key.properties, git-ignored — see
            // android/key.properties.example and docs/RELEASE_SIGNING.md).
            // Deliberately NOT falling back to signingConfigs.debug: a release
            // APK/AAB signed with the debug key must never be distributed, and
            // failing loudly here beats shipping one by accident.
            if (!keystorePropertiesExist) {
                throw new GradleException(
                    "Release build requires android/key.properties (git-ignored). " +
                    "Copy android/key.properties.example, point it at a real release " +
                    "keystore, and see docs/RELEASE_SIGNING.md."
                )
            }
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
