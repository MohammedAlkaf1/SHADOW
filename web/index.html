<body>
  
  
  
  
  
  <!-- Web Speech API bridge for UniAccess deaf mode -->
  <script>
    window.speechBridge = {
      _recognition: null,
      _isRunning: false,
      _onResult: null,
      _onError: null,

      start: function(onResult, onError) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          onError('not_supported');
          return;
        }
        this._onResult = onResult;
        this._onError  = onError;
        this._isRunning = true;
        this._createAndStart(SR);
      },

      _createAndStart: function(SR) {
        var self = this;
        var r = new SR();
        r.continuous      = true;
        r.interimResults  = true;
        r.lang            = 'ar-SA';
        r.maxAlternatives = 1;

        r.onresult = function(event) {
          var transcript = '';
          for (var i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          if (self._onResult) self._onResult(transcript);
        };

        r.onerror = function(event) {
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            self._isRunning = false;
            if (self._onError) self._onError(event.error);
          }
          // other errors (network, no-speech) → auto-restart
        };

        r.onend = function() {
          // restart automatically as long as recording is active
          if (self._isRunning && SR) {
            setTimeout(function() {
              if (self._isRunning) self._createAndStart(SR);
            }, 200);
          }
        };

        self._recognition = r;
        r.start();
      },

      stop: function() {
        this._isRunning = false;
        if (this._recognition) {
          try { this._recognition.stop(); } catch(e) {}
          this._recognition = null;
        }
        this._onResult = null;
        this._onError  = null;
      },

      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      }
    };
  </script>

  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
